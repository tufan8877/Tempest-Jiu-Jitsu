kind = "web"
previewPath = "/"
title = "BJJ Club Website"
description = "Eine moderne, mehrseitige Webseite für einen Brazilian Jiu-Jitsu Club. Enthält Startseite, Über uns, Kontakt, Impressum und Datenschutz. Zielgruppe sind Interessierte und Mitglieder des Clubs."
version = "1.0.0"
id = "artifacts/bjj-club"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23251

[services.development]
run = "pnpm --filter @workspace/bjj-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bjj-club", "run", "build" ]
serve = "static"
publicDir = "artifacts/bjj-club/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23251"
BASE_PATH = "/"
